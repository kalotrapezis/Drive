<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Call</title>
<style>
  :root { --ct: #BE7E4D; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1e2124; color: #eceeef; font: 14px/1.3 system-ui, "Noto Sans", sans-serif; overflow: hidden; -webkit-app-region: drag; user-select: none; }
  .bubble { display: flex; gap: 14px; align-items: center; padding: 16px 16px 12px; }
  .face { width: 60px; height: 60px; border-radius: 50%; flex: none; object-fit: cover; display: grid; place-items: center; font-size: 26px; color: #fff;
    background: linear-gradient(135deg, #D7A982, var(--ct), #8D5A3B); }
  .who { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .number, .sound { color: #a3a8ac; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { margin-top: 2px; color: var(--ct); font-weight: 600; }
  .buttons { display: flex; gap: 10px; justify-content: flex-end; padding: 0 16px 14px; -webkit-app-region: no-drag; }
  button { border: 0; border-radius: 999px; padding: 9px 18px; font: inherit; font-weight: 600; color: #fff; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .answer { background: #2e9d4f; } .decline, .end { background: #c62f2f; } .close { background: #3a3f43; }
  .said { color: #ff9b8f; font-size: 12px; padding: 0 16px 8px; }
  .soft { background: #3a3f43; padding: 8px 11px; font-size: 13px; } .soft.on { background: #eceeef; color: #1e2124; }
  .soft.icon { padding: 6px 9px; display: grid; place-items: center; flex: none; }
  .buttons:has(.soft) { gap: 6px; } .buttons:has(.soft) .end { padding: 8px 14px; font-size: 13px; }
  .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding: 0 16px 12px; -webkit-app-region: no-drag; }
  .keys button { background: #2c3034; padding: 8px 0; font-size: 16px; }
  .keys:empty { display: none; }
</style>
</head>
<body>
<div class="bubble"><div id="faceBox"></div><div class="who"><div class="name" id="name"></div><div class="number" id="number"></div><div class="state" id="state"></div><div class="sound" id="sound"></div></div></div>
<div class="said" id="said"></div>
<div class="keys" id="keys"></div>
<div class="buttons" id="buttons"></div>
<script>
  let s = null, tick = null, keys = false, asking = false
  const $ = id => document.getElementById(id)
  // the words in Tetra's language (i18n.js; no plurals here)
  const W = window.call.words, t = (k, v) => (W.words[k] ?? W.fallback[k] ?? k).replace(/\{(\w+)\}/g, (m, n) => v && n in v ? v[n] : m)
  document.documentElement.lang = W.lang; document.title = t('calls.windowTitle')
  const time = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}` }
  function draw() {
    if (!s) return
    const box = $('faceBox'); box.innerHTML = ''
    const face = document.createElement(s.photo ? 'img' : 'div'); face.className = 'face'
    if (s.photo) face.src = 'data:image/jpeg;base64,' + s.photo
    else { const ch = (s.name || '').trim()[0]; if (ch && /[\p{L}\p{N}]/u.test(ch)) face.textContent = ch.toUpperCase()
      else face.innerHTML = '<svg width="30" height="30" viewBox="0 -960 960 960" fill="#fff"><path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/></svg>' }
    box.appendChild(face)
    $('name').textContent = s.name || s.number || t('calls.unknownNumber')
    $('number').textContent = s.name ? s.number : (s.device ? t('calls.onDevice', { device: s.device }) : '')
    $('state').textContent = s.state === 'calling' ? t('calls.stateCalling') : s.state === 'ringing' ? t('calls.stateIncoming') : s.state === 'active' ? time(Date.now() - s.since) + (s.muted ? ' · ' + t('calls.stateMuted') : '')
      : s.state === 'held' ? t('calls.stateHeld') : s.missed ? t('calls.stateMissed') : t('calls.stateEnded')
    if (s.recording) $('state').textContent += ' · ● ' + t('calls.stateRecording')
    $('sound').textContent = s.state === 'ended' ? '' : s.sound
    const b = $('buttons'); b.innerHTML = ''
    const add = (cls, label, what) => { const x = document.createElement('button'); x.className = cls; x.textContent = label; x.onclick = () => { $('said').textContent = ''; window.call.press(what) }; b.appendChild(x) }
    if (s.state === 'ringing') { add('decline', t('calls.decline'), 'decline'); add('answer', t('calls.answer'), 'answer') }
    else if (s.state === 'calling' || s.state === 'active' || s.state === 'held') {
      // Tetra the phone's phone app: mute, hold and the keypad from here too (Drive-Android Plan.md § Phone)
      if (s.phoneApp && s.state !== 'calling') {
        add(`soft ${s.muted ? 'on' : ''}`, s.muted ? t('calls.muted') : t('calls.mute'), s.muted ? 'unmute' : 'mute')
        add(`soft ${s.state === 'held' ? 'on' : ''}`, s.state === 'held' ? t('common.resume') : t('calls.hold'), s.state === 'held' ? 'unhold' : 'hold')
        // the call's sound to the phone's loudspeaker and back (the user, 27 Oct); its name in the tooltip, the route in the sound line
        const loud = s.route === 'speaker'
        add(`soft icon ${loud ? 'on' : ''}`, '', loud ? 'unspeaker' : 'speaker')
        Object.assign(b.lastChild, { title: t('calls.speaker'), innerHTML: '<svg width="18" height="18" viewBox="0 -960 960 960" fill="currentColor"><path d="M560-131v-82q90-26 145-100t55-168q0-94-55-168T560-749v-82q124 28 202 125.5T840-481q0 127-78 224.5T560-131ZM120-360v-240h160l200-200v640L280-360H120Zm440 40v-322q47 22 73.5 66t26.5 96q0 51-26.5 94.5T560-320Z"/></svg>' })
        b.lastChild.setAttribute('aria-label', t('calls.speaker')); b.lastChild.setAttribute('aria-pressed', String(loud))
        // the call's sound to the phone, or onto this computer's Bluetooth (the user, 29 Oct: "where I answer, the sound goes there")
        if (s.move) {
          const label = t(s.move === 'phone' ? 'calls.toPhone' : 'calls.toComputer')
          add('soft icon', '', s.move)
          Object.assign(b.lastChild, { title: label, innerHTML: s.move === 'phone'
            ? '<svg width="18" height="18" viewBox="0 -960 960 960" fill="currentColor"><path d="M280-40q-33 0-56.5-23.5T200-120v-720q0-33 23.5-56.5T280-920h400q33 0 56.5 23.5T760-840v720q0 33-23.5 56.5T680-40H280Zm0-200v120h400v-120H280Zm200 100q17 0 28.5-11.5T520-180q0-17-11.5-28.5T480-220q-17 0-28.5 11.5T440-180q0 17 11.5 28.5T480-140Z"/></svg>'
            : '<svg width="18" height="18" viewBox="0 -960 960 960" fill="currentColor"><path d="M40-120v-80h880v80H40Zm120-120q-33 0-56.5-23.5T80-320v-440q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v440q0 33-23.5 56.5T800-240H160Z"/></svg>' })
          b.lastChild.setAttribute('aria-label', label)
        }
        const k = document.createElement('button'); k.className = `soft ${keys ? 'on' : ''}`; k.textContent = t('calls.keys'); k.onclick = () => { keys = !keys; draw() }; b.appendChild(k)
      }
      if (s.recording) add('soft on', t('calls.stopRec'), 'stoprec')
      else if (s.canRecord) { const r = document.createElement('button'); r.className = 'soft'; r.textContent = t('calls.record'); r.onclick = () => { asking = true; draw() }; b.appendChild(r) }
      add('end', t('calls.end'), 'end')
    } else add('close', t('common.close'), 'close')
    // the other person's explicit yes first (Greek Penal Code 370A: recording one's own call without it is a crime)
    if (asking && s.canRecord && !s.recording) {
      $('said').innerHTML = ''; $('said').style.color = '#eceeef'
      $('said').textContent = t('calls.askFirst')
      b.innerHTML = ''
      const no = document.createElement('button'); no.className = 'close'; no.textContent = t('common.cancel'); no.onclick = () => { asking = false; $('said').textContent = ''; draw() }; b.appendChild(no)
      const yes = document.createElement('button'); yes.className = 'answer'; yes.textContent = t('calls.agreed'); yes.onclick = () => { asking = false; $('said').textContent = ''; window.call.press('record') }; b.appendChild(yes)
    } else $('said').style.color = ''
    const pad = $('keys'); pad.innerHTML = ''
    if (keys && s.phoneApp && s.state === 'active') for (const d of '123456789*0#') {
      const x = document.createElement('button'); x.textContent = d; x.onclick = () => window.call.press('dtmf' + d); pad.appendChild(x)
    }
    window.call.height(pad.childElementCount ? 250 : asking ? 190 : 150)
  }
  window.call.on(next => { s = next; draw(); clearInterval(tick); if (s.state === 'active') tick = setInterval(() => { $('state').textContent = time(Date.now() - s.since) }, 1000) })
  window.call.said(t => { $('said').textContent = t })
</script>
</body>
</html>
