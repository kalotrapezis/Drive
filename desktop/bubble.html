<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Call</title>
<style>
  :root { --ct: #BE7E4D; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1e2124; color: #eceeef; font: 14px/1.3 system-ui, "Noto Sans", sans-serif; overflow: hidden; -webkit-app-region: drag; user-select: none; }
  .bubble { display: flex; gap: 14px; align-items: center; padding: 16px 16px 12px; }
  .face { width: 60px; height: 60px; border-radius: 50%; flex: none; object-fit: cover; display: grid; place-items: center; font-size: 26px; color: #fff;
    background: linear-gradient(135deg, #D7A982, var(--ct), #8D5A3B); }
  .who { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .number, .sound { color: #a3a8ac; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .state { margin-top: 2px; color: var(--ct); font-weight: 600; }
  .buttons { display: flex; gap: 10px; justify-content: flex-end; padding: 0 16px 14px; -webkit-app-region: no-drag; }
  button { border: 0; border-radius: 999px; padding: 9px 18px; font: inherit; font-weight: 600; color: #fff; cursor: pointer; }
  .answer { background: #2e9d4f; } .decline, .end { background: #c62f2f; } .close { background: #3a3f43; }
  .said { color: #ff9b8f; font-size: 12px; padding: 0 16px 8px; }
</style>
</head>
<body>
<div class="bubble"><div id="faceBox"></div><div class="who"><div class="name" id="name"></div><div class="number" id="number"></div><div class="state" id="state"></div><div class="sound" id="sound"></div></div></div>
<div class="said" id="said"></div>
<div class="buttons" id="buttons"></div>
<script>
  let s = null, tick = null
  const $ = id => document.getElementById(id)
  const time = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}` }
  function draw() {
    if (!s) return
    const box = $('faceBox'); box.innerHTML = ''
    const face = document.createElement(s.photo ? 'img' : 'div'); face.className = 'face'
    if (s.photo) face.src = 'data:image/jpeg;base64,' + s.photo
    else { const ch = (s.name || '').trim()[0]; if (ch && /[\p{L}\p{N}]/u.test(ch)) face.textContent = ch.toUpperCase()
      else face.innerHTML = '<svg width="30" height="30" viewBox="0 -960 960 960" fill="#fff"><path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/></svg>' }
    box.appendChild(face)
    $('name').textContent = s.name || s.number || 'Unknown number'
    $('number').textContent = s.name ? s.number : (s.device ? `on ${s.device}` : '')
    $('state').textContent = s.state === 'calling' ? 'Calling…' : s.state === 'ringing' ? 'Incoming call' : s.state === 'active' ? time(Date.now() - s.since) : s.missed ? 'Missed call' : 'Call ended'
    $('sound').textContent = s.state === 'ended' ? '' : s.sound
    const b = $('buttons'); b.innerHTML = ''
    const add = (cls, label, what) => { const x = document.createElement('button'); x.className = cls; x.textContent = label; x.onclick = () => { $('said').textContent = ''; window.call.press(what) }; b.appendChild(x) }
    if (s.state === 'ringing') { add('decline', 'Decline', 'decline'); add('answer', 'Answer', 'answer') }
    else if (s.state === 'calling' || s.state === 'active') add('end', 'End call', 'end')
    else add('close', 'Close', 'close')
  }
  window.call.on(next => { s = next; draw(); clearInterval(tick); if (s.state === 'active') tick = setInterval(() => { $('state').textContent = time(Date.now() - s.since) }, 1000) })
  window.call.said(t => { $('said').textContent = t })
</script>
</body>
</html>
